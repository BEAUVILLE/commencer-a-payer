<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c2d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Commencer à payer — DIGIYLYFE</title>
  <style>
    html,body{margin:0;min-height:100%;background:#123c2d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center}
    .loading{padding:24px;font-weight:900}
  </style>
</head>
<body>
  <p class="loading">DIGIYLYFE — chargement…</p>
  <script>
    (function(){
      var allowed=/^(fr|en|es|de|it|nl|ar)$/;
      var params=new URLSearchParams(location.search);
      var lang=(params.get('lang')||'').toLowerCase();
      try{if(!allowed.test(lang))lang=(localStorage.getItem('digiy-lang')||'').toLowerCase()}catch(e){}
      if(!allowed.test(lang))lang=(navigator.language||'fr').slice(0,2).toLowerCase();
      if(!allowed.test(lang))lang='fr';
      try{localStorage.setItem('digiy-lang',lang)}catch(e){}

      function fallbackBarScript(current){
        return '<style id="digiy-inline-lang-style">#digiy-i18n-bar{position:fixed;z-index:2147483600;top:max(8px,env(safe-area-inset-top));right:8px;display:flex;align-items:center;gap:4px;max-width:calc(100vw - 16px);overflow-x:auto;padding:5px;border:1px solid rgba(246,196,83,.75);border-radius:999px;background:rgba(3,18,13,.96);box-shadow:0 10px 30px rgba(0,0,0,.38)}#digiy-i18n-bar button{flex:0 0 auto;min-width:34px;height:34px;padding:0 7px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font:800 10px/1 system-ui;cursor:pointer}#digiy-i18n-bar button[aria-pressed="true"]{background:linear-gradient(135deg,#fff1bd,#f6c453,#22c55e);color:#06140f}#digiy-i18n-bar .digiy-speak{font-size:15px;min-width:38px}@media(max-width:520px){#digiy-i18n-bar{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));right:8px;left:8px}}</style>'+
        '<script>(function(){var current="'+current+'",codes=["fr","en","es","de","it","nl","ar"],voice={fr:"fr-FR",en:"en-US",es:"es-ES",de:"de-DE",it:"it-IT",nl:"nl-NL",ar:"ar-SA"};function mount(){if(document.getElementById("digiy-i18n-bar"))return;var bar=document.createElement("nav");bar.id="digiy-i18n-bar";bar.setAttribute("aria-label","Choisir la langue");codes.forEach(function(code){var b=document.createElement("button");b.type="button";b.textContent=code.toUpperCase();b.setAttribute("aria-pressed",code===current?"true":"false");b.addEventListener("click",function(){try{localStorage.setItem("digiy-lang",code)}catch(e){}var u=new URL(location.href);u.searchParams.set("lang",code);location.replace(u.toString())});bar.appendChild(b)});var s=document.createElement("button");s.type="button";s.className="digiy-speak";s.textContent="🔊";s.setAttribute("aria-label","Écouter");s.addEventListener("click",function(){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();var root=document.querySelector("main")||document.body;var text=(root.innerText||"").slice(0,12000);var u=new SpeechSynthesisUtterance(text);u.lang=voice[current]||voice.fr;window.speechSynthesis.speak(u)});bar.appendChild(s);document.body.appendChild(bar)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);else mount()})();<\/script>';
      }

      fetch('./app.html?v=20260730b',{cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('load');return r.text()})
        .then(function(html){
          var inject='<base href="./">'+
            '<script>try{localStorage.setItem("digiy-lang","'+lang+'") }catch(e){}<\/script>'+
            fallbackBarScript(lang)+
            '<script src="https://digiylyfe.com/assets/i18n/digiy-i18n.js?v=20260730b" defer><\/script>'+
            '<script src="https://digiylyfe.com/assets/i18n/digiy-route.js?v=20260730b" data-lang="'+lang+'" defer><\/script>';
          html=html.replace(/<head([^>]*)>/i,'<head$1>'+inject);
          document.open();document.write(html);document.close();
        })
        .catch(function(){location.replace('./app.html?lang='+lang)});
    })();
  </script>
</body>
</html>

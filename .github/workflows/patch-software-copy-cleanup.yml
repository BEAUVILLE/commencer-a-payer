name: Cleanup software option wording

on:
  push:
    branches:
      - agent/remonter-option-logiciel
    paths:
      - .github/workflows/patch-software-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align French and English software wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [Path("index.html"), Path("app.html")]
          sources = [p.read_text(encoding="utf-8") for p in paths]
          if sources[0] != sources[1]:
              raise SystemExit("index/app mismatch before cleanup")

          def patch(s):
              replacements = [
                  ('Logiciel métier disponible : +8 000 FCFA/mois', 'Logiciel métier facultatif : +8 000 FCFA / +15 € / mois'),
                  ('offers the business software as an optional +8,000 FCFA monthly add-on', 'offers the business software as an optional +8,000 FCFA / +15 € monthly add-on'),
                  ('For each of the eight business modules, the related software remains optional and adds +8,000 FCFA per month.', 'For each of the eight business modules, the related software remains optional and adds +8,000 FCFA / +15 € per month.'),
                  ('Business software remains optional and is billed only when deliberately added.', 'Business software remains optional and is billed only when deliberately added: +8,000 FCFA / +15 € per month.'),
                  ('Logiciel métier facultatif : +8 000 FCFA par mois.', 'Logiciel métier facultatif : +8 000 FCFA / +15 € par mois.'),
                  ('Optional business software: +8,000 FCFA per month.', 'Optional business software: +8,000 FCFA / +15 € per month.'),
              ]
              for old, new in replacements:
                  s = s.replace(old, new)
              if s.count('class="software-choice"') != 8:
                  raise SystemExit("Expected 8 software buttons")
              stale = [
                  'Logiciel métier disponible : +8 000 FCFA/mois',
                  'Tarif du logiciel en euros à confirmer.',
                  'Euro price for the software option to be confirmed.',
                  'optional +8,000 FCFA monthly add-on',
                  'adds +8,000 FCFA per month.',
              ]
              for item in stale:
                  if item in s:
                      raise SystemExit("Stale wording remains: " + item)
              return s

          updated = [patch(s) for s in sources]
          if updated[0] != updated[1]:
              raise SystemExit("index/app mismatch after cleanup")
          for p, text in zip(paths, updated):
              p.write_text(text, encoding="utf-8")

          wf = Path(".github/workflows/patch-software-copy-cleanup.yml")
          if wf.exists():
              wf.unlink()
          print("OK: wording aligned")
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "DIGIY Auto Patch"
          git config user.email "actions@github.com"
          git add index.html app.html .github/workflows/patch-software-copy-cleanup.yml
          git commit -m "Aligner libelles option logiciel" || echo "Nothing to commit"
          git push
